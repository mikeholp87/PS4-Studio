[package]
name = "ps4-studio"
description = "PS4 Studio desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "ps4_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Set by `cargo tauri build`: embeds the built UI instead of loading the dev server URL. DO NOT REMOVE.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
ps4studio-core = { path = "../../../crates/core" }
ps4studio-mock-console = { path = "../../../simulator/mock-console" }
ps4studio-discovery = { path = "../../../crates/discovery" }
ps4studio-remote-play = { path = "../../../crates/remote-play" }
ps4studio-diagnostics = { path = "../../../crates/diagnostics" }
tokio.workspace = true
tauri-plugin-dialog = "2"
ps4studio-console-adapters = { path = "../../../crates/console-adapters" }
ps4studio-backups = { path = "../../../crates/backups" }
sha2 = "0.10"

[package.metadata.deb]
name = "ps4-studio"
section = "utils"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
