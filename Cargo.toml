[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/discovery",
  "crates/remote-play",
  "crates/console-adapters",
  "crates/backups",
  "crates/diagnostics",
  "simulator/mock-console",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/OWNER/ps4-studio"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "process", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
