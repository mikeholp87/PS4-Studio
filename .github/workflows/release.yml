name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-cli --version '^2' --locked
      - run: cargo tauri build --bundles deb
        working-directory: apps/desktop/src-tauri
      - name: Checksums
        run: cd target/release/bundle/deb && sha256sum *.deb > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/SHA256SUMS
